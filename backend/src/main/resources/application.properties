spring.application.name=email-writer
server.port=${PORT:8085}

replai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
replai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
replai.gemini.api-key=${GEMINI_KEY:}
replai.gemini.request-timeout-ms=${GEMINI_TIMEOUT_MS:15000}
replai.gemini.connect-timeout=3s
replai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://replai.abbasansari.me,https://mail.google.com}

spring.cache.type=caffeine
spring.cache.cache-names=generateReply,improveReply
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=10m,recordStats

resilience4j.retry.instances.gemini.max-attempts=3
resilience4j.retry.instances.gemini.wait-duration=400ms
resilience4j.retry.instances.gemini.enable-exponential-backoff=true
resilience4j.retry.instances.gemini.exponential-backoff-multiplier=2
resilience4j.retry.instances.gemini.retry-exception-predicate=com.abbasansari.email_writer.config.GeminiRetryPredicate

resilience4j.circuitbreaker.instances.gemini.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.gemini.sliding-window-size=20
resilience4j.circuitbreaker.instances.gemini.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.gemini.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gemini.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gemini.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gemini.record-failure-predicate=com.abbasansari.email_writer.config.GeminiRetryPredicate

management.endpoints.web.exposure.include=health,metrics,caches,circuitbreakers

replai.rate-limit.capacity=${REPLAI_RATE_LIMIT_CAPACITY:60}
replai.rate-limit.refill-tokens=${REPLAI_RATE_LIMIT_REFILL_TOKENS:60}
replai.rate-limit.refill-duration-seconds=${REPLAI_RATE_LIMIT_REFILL_DURATION_SECONDS:60}